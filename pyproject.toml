[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "metaforge-verification"
version = "0.2.0"
description = "Independent, evidence-backed smart-device verification core"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "fastapi>=0.115,<1", "pydantic>=2.9,<3", "uvicorn>=0.30,<1",
  "sqlalchemy>=2.0,<3", "pint>=0.24,<1", "pillow>=10,<13"
]

[project.optional-dependencies]
engineering = ["cadquery-ocp==7.8.1.1.post1", "opencv-python-headless==4.11.0.86", "numpy>=2,<3"]
s3 = ["boto3>=1.35,<2"]
postgres = ["psycopg[binary]>=3.2,<4"]
temporal = ["temporalio>=1.10,<2"]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.9,<1", "build>=1,<2"]

[project.scripts]
metaforge-verification = "metaforge_verification.cli:main"

[project.entry-points."metaforge.verification.checks"]
# Third-party checks implement the protocol in adapters/base.py; installed checks
# are operator-trusted code, never uploaded per request.

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
metaforge_verification = ["web/*.html", "web/*.css", "web/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
