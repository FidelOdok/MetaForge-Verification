<!doctype html>
<meta charset="utf-8">
<title>Verification controlled capture</title>
<style>html,body{margin:0;background:#fff}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"/three/build/three.module.js","three/addons/":"/three/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
const renderer = new THREE.WebGLRenderer({antialias:false, alpha:false, preserveDrawingBuffer:true});
renderer.setSize(512,512); renderer.setPixelRatio(1); renderer.setClearColor(0xffffff);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.add(new THREE.HemisphereLight(0xffffff,0x666666,3));
const model = (await new GLTFLoader().loadAsync('/model.glb')).scene;
scene.add(model);
const box = new THREE.Box3().setFromObject(model);
if(box.isEmpty()) throw new Error('Empty model');
const center = box.getCenter(new THREE.Vector3());
const size = box.getSize(new THREE.Vector3());
const span = Math.max(size.x,size.y,size.z);
if(!Number.isFinite(span)||span<=0) throw new Error('Invalid bounds');
const camera = new THREE.OrthographicCamera(-span,span,span,-span,span/1000,span*20);
const directions = {front:[0,0,1],side:[1,0,0],top:[0,1,0],iso:[1,1,1]};
window.captureView = (name) => {
  const direction = new THREE.Vector3(...directions[name]).normalize();
  camera.position.copy(center).addScaledVector(direction,span*4);
  camera.up.set(0,1,0); if(name==='top') camera.up.set(0,0,-1);
  camera.lookAt(center); camera.updateProjectionMatrix();
  renderer.render(scene,camera);
  return renderer.domElement.toDataURL('image/png');
};
window.modelBounds = {min:box.min.toArray(), max:box.max.toArray()};
window.renderReady = true;
</script>
