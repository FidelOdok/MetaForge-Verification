name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.lock
      - run: pip install --no-deps -e .
      - run: ruff check .
      - run: ruff format --check .
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16.6
        env:
          POSTGRES_USER: verification
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: verification_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U verification"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.lock
      - run: pip install --no-deps -e .
      - run: pytest -q --junitxml=results.xml
        env:
          VERIFICATION_TEST_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql+psycopg://verification:test-only@localhost:5432/verification_test' || '' }}
      - run: python examples/demo.py
      - run: python scripts/smoke_http.py
      - run: python scripts/export_openapi.py --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ matrix.database }}
          path: results.xml
  visual:
    # ubuntu-latest moved to 26.04, where Playwright 1.58 cannot install Chromium
    # ("does not support chromium on ubuntu26.04-x64"). Pinned until Playwright is bumped.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: visual-capture/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: visual-capture
      - run: npx playwright install --with-deps chromium
        working-directory: visual-capture
      - run: npm test
        working-directory: visual-capture
      - run: python scripts/make_capture_fixture.py /tmp/fixture.glb
      - run: node visual-capture/capture.mjs /tmp/fixture.glb /tmp/captures r1
      - run: python scripts/check_capture.py /tmp/captures
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: controlled-capture
          path: /tmp/captures
  package:
    needs: [lint, tests, visual]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.lock
      - run: python -m build
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: metaforge-verification:ci
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/
